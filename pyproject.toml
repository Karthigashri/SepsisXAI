[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sepsispulse"
version = "0.1.0"
description = "Confidence-aware, explainable sepsis risk research prototype"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.142.2",
    "joblib==1.6.0",
    "numpy==2.5.3",
    "pandas==3.0.6",
    "python-multipart==0.0.32",
    "scikit-learn==1.9.1",
    "shap==0.52.0",
    "uvicorn[standard]==0.54.0",
    "xgboost==3.4.1",
]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sepsispulse = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
